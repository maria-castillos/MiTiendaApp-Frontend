<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - MiTiendaApp</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="blue lighten-1">
    <div class="nav-wrapper container">
      <a href="index.html" class="brand-logo"><i class="material-icons">store</i> MiTiendaApp</a>
    </div>
  </nav>

  <div class="container section">
    <div class="row">
      <div class="col s12 m6 offset-m3">
        <div class="card">
          <div class="card-content">
            <span class="card-title center">Crear Cuenta</span>
            <form id="registroForm">
              
              <div class="input-field">
                <input id="fullname" name="fullname" type="text" required>
                <label for="fullname">Nombre completo</label>
              </div>
              
              <div class="input-field">
                <input id="email" name="email" type="email" required>
                <label for="email">Correo electrónico</label>
              </div>
              
              <div class="input-field">
                <input id="password" name="password" type="password" required autocomplete="off">
                <label for="password">Contraseña</label>
              </div>
              
              <div class="input-field">
                <input id="phone_number" name="phone_number" type="text" required>
                <label for="phone_number">Teléfono</label>
              </div>
              
              <div class="input-field">
                <input id="address" name="address" type="text">
                <label for="address">Dirección</label>
              </div>
              
              <div class="center">
                <button type="submit" class="btn blue">Registrarme</button>
              </div>
            </form>
          </div>

          <div class="card-action center">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
          </div>

        </div>
      </div>
    </div>
  </div>

  <footer class="page-footer blue lighten-1">
    <div class="container center">
      <p>© 2025 MiTiendaApp</p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
