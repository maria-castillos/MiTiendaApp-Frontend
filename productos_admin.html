<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - MiTiendaApp</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- NAV -->
  <nav class="blue lighten-1">
    <div class="nav-wrapper container">
      <a href="index.html" class="brand-logo">
        <i class="material-icons">store</i> MiTiendaApp
      </a>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a href="admin_pedidos.html">Pedidos</a></li>
        <li><a id="logoutBtn">Cerrar sesión</a></li>
      </ul>
      
    </div>
  </nav>

  <!-- CONTENIDO -->
  <div class="container section">

    <h4 class="center">Gestión de Productos</h4>

    <!-- BOTÓN CREAR -->
    <div class="right-align">
      <a id="btnNuevoProducto" class="btn green modal-trigger" href="#modalCrear">
        <i class="material-icons left">add</i> Nuevo Producto
      </a>
    </div>

    <br>

    <!-- TABLA DE PRODUCTOS -->
    <table class="striped highlight responsive-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaProductos"></tbody>
    </table>

  </div>

  <!-- MODAL CREAR -->
  <div id="modalCrear" class="modal">
    <div class="modal-content">
      <h5>Agregar Producto</h5>

      <div class="row">
        <form class="col s12" id="formCrear">

          <div class="input-field col s12">
            <input id="create_name" type="text" required>
            <label for="create_name">Nombre del producto</label>
          </div>

          <div class="input-field col s12">
            <input id="create_price" type="number" min="1" step="0.01" required>
            <label for="create_price">Precio</label>
          </div>

          <div class="input-field col s12">
            <input id="create_stock" type="number" min="0" required>
            <label for="create_stock">Stock</label>
          </div>

          <button type="submit" class="btn green">Guardar</button>

        </form>
      </div>
    </div>
  </div>

  <!-- MODAL EDITAR -->
  <div id="modalEditar" class="modal">
    <div class="modal-content">
      <h5>Editar Producto</h5>

      <div class="row">
        <form class="col s12" id="formEditar">

          <input type="hidden" id="edit_id">

          <div class="input-field col s12">
            <input id="edit_name" type="text" required>
            <label class="active" for="edit_name">Nombre</label>
          </div>

          <div class="input-field col s12">
            <input id="edit_price" type="number" step="0.01" min="1" required>
            <label class="active" for="edit_price">Precio</label>
          </div>

          <div class="input-field col s12">
            <input id="edit_stock" type="number" min="0" required>
            <label class="active" for="edit_stock">Stock</label>
          </div>

          <button type="submit" class="btn blue">Actualizar</button>

        </form>
      </div>
    </div>
  </div>

  <!-- MATERIALIZE JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/protegerRutas.js"></script>
  <script src="js/logout.js"></script>
  <script src="js/productos_admin.js"></script>
</body>
</html>
